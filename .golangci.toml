version = "2"

[run]
    timeout = "5m"
    issues-exit-code = 1
    tests = true

[linters]
    # The `standard` set adds errcheck, govet, ineffassign, staticcheck and
    # unused. In v2, staticcheck includes gosimple and stylecheck, and
    # unused replaces deadcode, structcheck and varcheck.
    default = "standard"
    enable = [
        "bodyclose",        # checks whether HTTP response body is closed successfully
        "depguard",         # checks if package imports are in a list of acceptable packages
        "durationcheck",    # check for two durations multiplied together
        "err113",           # checks that you use errors.Is and don't define your own errors except as package variables
        "errname",          # checks that sentinel errors are prefixed with Err and error types are suffixed with Error
        "errorlint",        # finds code that will cause problems with the error wrapping scheme introduced in Go 1.13
        "forcetypeassert",  # finds type asserts where you don't use the v, ok format
        "gochecknoinits",   # checks that no init functions are present in Go code
        "gocritic",         # provides many diagnostics that check for bugs, performance and style issues
        "godot",            # check if comments end in a period
        "gosec",            # inspects source code for security problems
        "makezero",         # checks that you don't accidentally make a slice w/ nonzero length and then append to it
        "misspell",         # finds commonly misspelled English words in comments
        "nakedret",         # finds naked returns in functions greater than a specified function length
        "nilerr",           # finds the code that returns nil even if it checks that the error is not nil
        "noctx",            # finds sending http request without context.Context
        "nolintlint",       # reports ill-formed or insufficient nolint directives
        "prealloc",         # finds slice declarations that could potentially be preallocated
        "predeclared",      # find code that shadows one of Go's predeclared identifiers
        "rowserrcheck",     # checks whether Err of rows is checked successfully
        "sqlclosecheck",    # checks that sql.Rows and sql.Stmt are closed
        "unconvert",        # remove unnecessary type conversions
        "wastedassign",     # finds wasted assignment statements
    ]

[linters.settings.depguard.rules.main]
    [[linters.settings.depguard.rules.main.deny]]
        pkg = "github.com/pkg/error"
        desc = "Please use stdlib errors module"

[linters.settings.errcheck]
    check-type-assertions = true
    check-blank = false
    # golangci-lint v1 ignored all of package `fmt` by default.
    exclude-functions = [
        "fmt.Fprint",
        "fmt.Fprintf",
        "fmt.Fprintln",
    ]

[linters.settings.errorlint]
    errorf = true
    asserts = false
    comparison = false

[linters.settings.gocritic]
    enabled-tags = [
        "diagnostic",
        "performance",
        "style",
    ]
    disabled-checks = [
        "importShadow",
        "preferStringWriter",
        "paramTypeCombine",
        "unnamedResult",
        "emptyStringTest",
        "elseif",
        "whyNoLint",
    ]
    [linters.settings.gocritic.settings.hugeParam]
        sizeThreshold = 256

[linters.settings.govet]
    enable = ["httpresponse"]

[linters.settings.gosec]
    excludes = [
        "G301", # Expect directory permissions to be 0750 or less. See umask.
        "G307", # deferring methods with errors. This duplicates errcheck, and I don't want to have to use two nolints.
    ]

[linters.settings.nolintlint]
    allow-unused = false
    require-explanation = false
    require-specific = true

[[linters.exclusions.rules]]
    # The noctx `exec.Command` check is new in golangci-lint v2. Passing a
    # context to all git commands is a separate change.
    linters = ["noctx"]
    text = "os/exec.Command must not be called"

[[linters.exclusions.rules]]
    path = "_test\\.go"
    linters = ["errcheck", "gosec", "gocyclo", "noctx", "govet"]

[[linters.exclusions.rules]]
    path = "\\.go$"
    text = ".*do not define dynamic errors, use wrapped static errors instead.*"

[issues]
    max-issues-per-linter = 0
    max-same-issues = 0

[formatters]
    enable = ["goimports"]
